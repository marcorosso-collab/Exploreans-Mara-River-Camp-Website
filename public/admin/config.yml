backend:
  name: github
  repo: marcorosso-collab/Exploreans-Mara-River-Camp-Website
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Uploaded photographs are converted to WebP and capped at 1920 px (Brand Bible image specifications)
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1920
          height: 1920

# Brand reminders for editors (Exploreans Brand Bible v1.0):
# sentence case, British English, no dashes as punctuation, no exclamation marks,
# describe what the camp is (no comparisons or negatives), no star ratings or luxury vocabulary,
# name the person who leads each experience wherever possible, real photography with alt text.

collections:

  # ═══════════════════════════════════════════════════════════
  # SITE SETTINGS
  # ═══════════════════════════════════════════════════════════
  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Contacts, booking and navigation"
        file: "src/content/settings/site.json"
        format: json
        fields:
          - { label: "Property name", name: "property_name", widget: "string" }
          - { label: "Region", name: "region", widget: "string" }
          - { label: "Default description (SEO)", name: "default_description", widget: "text" }
          - { label: "Default share image", name: "og_image", widget: "image" }
          - { label: "Booking engine URL", name: "booking_url", widget: "string", hint: "Simplebooking link. Dates and guests are added automatically." }
          - { label: "Reservations email", name: "reservations_email", widget: "string" }
          - { label: "General email", name: "info_email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Reservations hours", name: "reservations_hours", widget: "string" }
          - { label: "Address lines", name: "address", widget: "list", field: { label: "Line", name: "line", widget: "string" } }
          - { label: "Google Maps link", name: "maps_url", widget: "string" }
          - { label: "Latitude", name: "latitude", widget: "number", value_type: "float" }
          - { label: "Longitude", name: "longitude", widget: "number", value_type: "float" }
          - label: "Navigation"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - label: "Social accounts"
            name: "social"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - { label: "Legal line (footer)", name: "group_line", widget: "text" }
          - label: "Legal entities"
            name: "legal"
            widget: "object"
            fields:
              - label: "Owner and operator"
                name: "operator"
                widget: "object"
                fields:
                  - { label: "Company name", name: "name", widget: "string" }
                  - { label: "Trading as", name: "trading_as", widget: "string" }
                  - { label: "Company number", name: "company_number", widget: "string" }
                  - { label: "Business registration number", name: "business_registration", widget: "string" }
                  - { label: "Registered address", name: "address", widget: "string" }
              - label: "Brand franchisor"
                name: "franchisor"
                widget: "object"
                fields:
                  - { label: "Company name", name: "name", widget: "string" }
                  - { label: "Address", name: "address", widget: "string" }
                  - { label: "VAT number", name: "vat", widget: "string" }
              - { label: "Privacy contact email", name: "privacy_email", widget: "string" }
          - label: "Newsletter"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button", name: "button", widget: "string" }
              - { label: "Thank-you message", name: "success", widget: "string" }

  # ═══════════════════════════════════════════════════════════
  # PAGES
  # ═══════════════════════════════════════════════════════════
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "src/content/pages/home.json"
        format: json
        fields:
          - { label: "SEO title", name: "seo_title", widget: "string", required: false }
          - { label: "SEO description", name: "seo_description", widget: "text", required: false }
          - label: "1. Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Lead (optional)", name: "lead", widget: "text", required: false }
              - { label: "Film (desktop, MP4)", name: "video", widget: "file" }
              - { label: "Film (phones, MP4)", name: "video_mobile", widget: "file" }
              - { label: "Poster image", name: "poster", widget: "image" }
              - { label: "Film description (alt text)", name: "alt", widget: "string" }
          - label: "2. What you will live"
            name: "story"
            widget: "object"
            fields:
              - { label: "Kicker", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Story text", name: "text", widget: "text", hint: "Write {0}, {1} and so on where each photographed phrase below sits." }
              - label: "Photographed phrases"
                name: "targets"
                widget: "list"
                fields:
                  - { label: "Phrase", name: "text", widget: "string" }
                  - { label: "Photograph", name: "image", widget: "image" }
                  - { label: "Alt text", name: "alt", widget: "string" }
          - label: "3. A day at the camp"
            name: "day"
            widget: "object"
            fields:
              - { label: "Kicker", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Moments"
                name: "moments"
                widget: "list"
                fields:
                  - { label: "Time of day", name: "time", widget: "string" }
                  - { label: "Experience", name: "experience", widget: "relation", collection: "experiences", value_field: "{{slug}}", search_fields: ["name"], display_fields: ["name"] }
                  - { label: "Text", name: "body", widget: "text" }
                  - { label: "Photograph", name: "image", widget: "image", required: false, hint: "Leave empty for the night panel." }
                  - { label: "Alt text", name: "alt", widget: "string", required: false }
          - label: "Five ways to explore"
            name: "families"
            widget: "object"
            fields:
              - { label: "Kicker (optional)", name: "label", widget: "string", required: false }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead (optional)", name: "lead", widget: "text", required: false }
          - label: "4. The people"
            name: "people"
            widget: "object"
            fields:
              - { label: "Kicker", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Photograph", name: "image", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
              - label: "Roles"
                name: "roles"
                widget: "list"
                fields:
                  - { label: "Role", name: "role", widget: "string" }
                  - { label: "Name (when the person agrees to be named)", name: "name", widget: "string", required: false }
                  - { label: "Text", name: "body", widget: "text" }
          - label: "5. Rooms and spaces"
            name: "stay"
            widget: "object"
            fields:
              - { label: "Kicker", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
          - label: "6. Look closer"
            name: "closer"
            widget: "object"
            fields:
              - { label: "Kicker", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Photograph (WebP with a -960 version)", name: "image", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
              - { label: "Hint", name: "hint", widget: "string" }
          - label: "6. What to expect"
            name: "expect"
            widget: "object"
            fields:
              - { label: "Kicker (optional)", name: "label", widget: "string", required: false }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead (optional)", name: "lead", widget: "text", required: false }
          - label: "7. The Passport"
            name: "passport"
            widget: "object"
            fields:
              - { label: "Kicker", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
          - label: "8. Plan your journey"
            name: "plan"
            widget: "object"
            fields:
              - { label: "Kicker", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }

      - name: "stay"
        label: "Stay"
        file: "src/content/pages/stay.json"
        format: json
        fields:
          - { label: "SEO title", name: "seo_title", widget: "string", required: false }
          - { label: "SEO description", name: "seo_description", widget: "text", required: false }
          - { label: "Kicker", name: "label", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Lead", name: "lead", widget: "text" }
          - { label: "Reveal photograph", name: "image", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string" }
          - label: "In camp"
            name: "in_camp"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }

      - name: "experiences"
        label: "Experiences"
        file: "src/content/pages/experiences.json"
        format: json
        fields:
          - { label: "SEO title", name: "seo_title", widget: "string", required: false }
          - { label: "SEO description", name: "seo_description", widget: "text", required: false }
          - { label: "Kicker", name: "label", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Lead", name: "lead", widget: "text" }

      - name: "passport"
        label: "Passport"
        file: "src/content/pages/passport.json"
        format: json
        fields:
          - { label: "SEO title", name: "seo_title", widget: "string", required: false }
          - { label: "SEO description", name: "seo_description", widget: "text", required: false }
          - { label: "Kicker", name: "label", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Lead", name: "lead", widget: "text" }
          - label: "How it will work"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Rewards"
            name: "rewards"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - { label: "Note", name: "note", widget: "string", required: false }
          - label: "Travel Journal"
            name: "journal"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Privacy line", name: "privacy", widget: "string" }
              - label: "Prompts"
                name: "prompts"
                widget: "list"
                fields:
                  - { label: "Direction", name: "direction", widget: "select", options: ["beyond", "within"] }
                  - { label: "Prompt", name: "prompt", widget: "string" }

      - name: "stories"
        label: "Stories"
        file: "src/content/pages/stories.json"
        format: json
        fields:
          - { label: "SEO title", name: "seo_title", widget: "string", required: false }
          - { label: "SEO description", name: "seo_description", widget: "text", required: false }
          - { label: "Kicker", name: "label", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Lead", name: "lead", widget: "text" }

      - name: "plan"
        label: "Plan your stay"
        file: "src/content/pages/plan.json"
        format: json
        fields:
          - { label: "SEO title", name: "seo_title", widget: "string", required: false }
          - { label: "SEO description", name: "seo_description", widget: "text", required: false }
          - { label: "Kicker", name: "label", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Lead", name: "lead", widget: "text" }
          - { label: "Header photograph", name: "image", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string" }
          - label: "Getting there"
            name: "getting_there"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Text", name: "value", widget: "text" }
          - label: "What to expect"
            name: "expect"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Text", name: "value", widget: "text" }
          - label: "Months"
            name: "months"
            widget: "list"
            fields:
              - { label: "Month", name: "month", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Great Migration at the river", name: "migration", widget: "boolean", default: false }
          - { label: "Season note", name: "season_note", widget: "text", required: false }
          - label: "Questions"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  # ═══════════════════════════════════════════════════════════
  # STAY
  # ═══════════════════════════════════════════════════════════
  - name: "stay"
    label: "Rooms"
    label_singular: "Room"
    folder: "src/content/stay"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Order", name: "order", widget: "number" }
      - { label: "Setting (kicker)", name: "setting", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Size", name: "size", widget: "string", hint: "For example: 17 sqm, with a 7 sqm terrace" }
      - { label: "Maximum guests", name: "guests", widget: "number" }
      - { label: "Sleeps (as written)", name: "sleeping", widget: "string" }
      - { label: "In the room", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
      - { label: "Main photograph", name: "image", widget: "image" }
      - { label: "Alt text", name: "alt", widget: "string" }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Photograph", name: "image", widget: "image" }
          - { label: "Alt text", name: "alt", widget: "string" }
      - { label: "SEO title", name: "seo_title", widget: "string", required: false }
      - { label: "SEO description", name: "seo_description", widget: "text", required: false }
      - { label: "Story", name: "body", widget: "markdown" }

  # ═══════════════════════════════════════════════════════════
  # EXPERIENCES (Brand Bible ch. 02: every experience described the same way)
  # ═══════════════════════════════════════════════════════════
  - name: "experiences"
    label: "Experiences"
    label_singular: "Experience"
    folder: "src/content/experiences"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: ["order", "name"]
    summary: "{{name}} · {{family}}"
    fields:
      - { label: "Name (sentence case, up to six words)", name: "name", widget: "string" }
      - { label: "Family", name: "family", widget: "select", options: ["adventure", "nature", "culture", "taste", "wellness"] }
      - label: "Passport stamp"
        name: "stamp"
        widget: "select"
        required: false
        hint: "Leave empty until the brand team draws a stamp for it."
        options:
          - { label: "On foot (Adventure)", value: "on-foot" }
          - { label: "Summit (Adventure)", value: "summit" }
          - { label: "Under sail (Adventure)", value: "under-sail" }
          - { label: "First light (Nature)", value: "first-light" }
          - { label: "Night sky (Nature)", value: "night-sky" }
          - { label: "The reef (Nature)", value: "the-reef" }
          - { label: "Village (Culture)", value: "village" }
          - { label: "Market (Culture)", value: "market" }
          - { label: "Craft (Culture)", value: "craft" }
          - { label: "Harvest (Taste)", value: "harvest" }
          - { label: "Local kitchen (Taste)", value: "local-kitchen" }
          - { label: "Tasting (Taste)", value: "tasting" }
          - { label: "Stillness (Wellness)", value: "stillness" }
          - { label: "Movement (Wellness)", value: "movement" }
          - { label: "Rest (Wellness)", value: "rest" }
          - { label: "Mara: On foot in Ole Sugut (Adventure)", value: "mara-on-foot-in-ole-sugut" }
          - { label: "Mara: Above the Mara (Adventure)", value: "mara-above-the-mara" }
          - { label: "Mara: After dark (Adventure)", value: "mara-after-dark" }
          - { label: "Mara: Game drive (Nature)", value: "mara-game-drive" }
          - { label: "Mara: Hippos at dusk (Nature)", value: "mara-hippos-at-dusk" }
          - { label: "Mara: Camp nature walk (Nature)", value: "mara-camp-nature-walk" }
          - { label: "Mara: Maasai village (Culture)", value: "mara-maasai-village" }
          - { label: "Mara: Around the fire (Culture)", value: "mara-around-the-fire" }
          - { label: "Mara: Bush breakfast (Taste)", value: "mara-bush-breakfast" }
          - { label: "Mara: Sundowner at the Elephant’s Couch (Taste)", value: "mara-sundowner-at-the-elephants-couch" }
          - { label: "Mara: By the pool (Wellness)", value: "mara-by-the-pool" }
          - { label: "Mara: Sunrise stillness (Wellness)", value: "mara-sunrise-stillness" }
      - { label: "Order", name: "order", widget: "number" }
      - { label: "With every stay (no charge)", name: "included", widget: "boolean", default: false }
      - { label: "Led by (role and, where possible, name)", name: "led_by", widget: "string" }
      - { label: "When and how long", name: "when", widget: "string" }
      - { label: "Where", name: "where", widget: "string", required: false }
      - { label: "What you will live (two or three sentences, present tense)", name: "live", widget: "text" }
      - { label: "Good to know", name: "good_to_know", widget: "text" }
      - label: "Rates"
        name: "rates"
        widget: "list"
        required: false
        hint: "One line per rate, for example: Half day, private jeep → USD 240 per jeep, up to seven guests"
        fields:
          - { label: "What", name: "label", widget: "string" }
          - { label: "Rate", name: "value", widget: "string" }
      - label: "Also payable (park, conservancy, guide, ranger fees)"
        name: "fees"
        widget: "list"
        required: false
        fields:
          - { label: "Fee", name: "label", widget: "string" }
          - { label: "Amount", name: "value", widget: "string" }
      - { label: "Photograph", name: "image", widget: "image", required: false }
      - { label: "Alt text", name: "alt", widget: "string", required: false }
      - { label: "SEO title", name: "seo_title", widget: "string", required: false }
      - { label: "SEO description", name: "seo_description", widget: "text", required: false }
      - { label: "Story", name: "body", widget: "markdown" }

  # ═══════════════════════════════════════════════════════════
  # STORIES
  # ═══════════════════════════════════════════════════════════
  - name: "stories"
    label: "Stories"
    label_singular: "Story"
    folder: "src/content/stories"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Family", name: "family", widget: "select", options: ["adventure", "nature", "culture", "taste", "wellness"] }
      - { label: "Author", name: "author", widget: "string", default: "The team at Mara River Camp" }
      - { label: "Photograph", name: "image", widget: "image" }
      - { label: "Alt text", name: "alt", widget: "string" }
      - { label: "First published on exploreans.com (link)", name: "canonical", widget: "string", required: false, hint: "Only for stories that also appear on exploreans.com." }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "SEO title", name: "seo_title", widget: "string", required: false }
      - { label: "SEO description", name: "seo_description", widget: "text", required: false }
      - { label: "Story", name: "body", widget: "markdown" }

  # ═══════════════════════════════════════════════════════════
  # LEGAL
  # ═══════════════════════════════════════════════════════════
  - name: "legal"
    label: "Legal pages"
    files:
      - name: "privacy"
        label: "Privacy policy"
        file: "src/content/legal/privacy.md"
        format: frontmatter
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last updated", name: "updated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { label: "Policy", name: "body", widget: "markdown" }
      - name: "cookies"
        label: "Cookie policy"
        file: "src/content/legal/cookies.md"
        format: frontmatter
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last updated", name: "updated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { label: "Policy", name: "body", widget: "markdown", hint: "Update the cookie tables whenever a new tag or tool is added to the site." }
