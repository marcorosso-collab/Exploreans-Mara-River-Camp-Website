# Exploreans Mara River Camp: Netlify build configuration

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sveltia CMS admin
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# ── Old addresses, kept alive after the 2026 rebuild ──
[[redirects]]
  from = "/accommodation/river-tents"
  to = "/stay/river-tents/"
  status = 301

[[redirects]]
  from = "/accommodation/bush-tents"
  to = "/stay/bush-tents/"
  status = 301

[[redirects]]
  from = "/accommodation/simbas-den"
  to = "/stay/simbas-den/"
  status = 301

[[redirects]]
  from = "/accommodation/*"
  to = "/stay/"
  status = 301

[[redirects]]
  from = "/experiences/game-drives"
  to = "/experiences/game-drive/"
  status = 301

[[redirects]]
  from = "/experiences/walking-tours"
  to = "/experiences/on-foot-in-ole-sugut/"
  status = 301

[[redirects]]
  from = "/experiences/maasai-culture"
  to = "/experiences/maasai-village/"
  status = 301

[[redirects]]
  from = "/experiences/bush-dining"
  to = "/experiences/bush-breakfast/"
  status = 301

[[redirects]]
  from = "/experiences/hot-air-balloon"
  to = "/experiences/above-the-mara/"
  status = 301

[[redirects]]
  from = "/journal/2026-01-when-to-visit"
  to = "/stories/a-year-on-the-mara-river/"
  status = 301

[[redirects]]
  from = "/journal/*"
  to = "/stories/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/plan-your-stay/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/stamps/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
